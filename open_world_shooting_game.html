<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World Map Shooting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* HUD - Top Left */
        .hud-top-left {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-panel {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 12px;
            padding: 10px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: #fff;
            min-width: 140px;
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64c8ff;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .hud-value {
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
        }

        /* Health Bar */
        .health-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8844, #44ff44);
            border-radius: 4px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(68, 255, 68, 0.4);
        }

        .health-text {
            font-size: 11px;
            margin-top: 4px;
            color: #ccc;
        }

        /* Weapon Panel - Top Right */
        .hud-top-right {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .weapon-btn {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            border: 2px solid rgba(100, 200, 255, 0.2);
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .weapon-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .weapon-btn:hover::before,
        .weapon-btn.active::before {
            opacity: 1;
        }

        .weapon-btn.active {
            border-color: #64c8ff;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .weapon-btn:active {
            transform: scale(0.95);
        }

        .weapon-icon {
            font-size: 22px;
            filter: drop-shadow(0 0 4px rgba(100, 200, 255, 0.6));
        }

        .weapon-name {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
        }

        .weapon-btn.active .weapon-name {
            color: #64c8ff;
        }

        /* Ammo counter */
        .ammo-display {
            position: fixed;
            top: 80px;
            right: 15px;
            z-index: 100;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 10px;
            padding: 8px 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .ammo-display span {
            color: #64c8ff;
        }

        /* Movement Controls - Bottom */
        .controls-bottom {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(100, 200, 255, 0.3);
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .control-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .control-btn.pressed {
            transform: scale(0.9);
            border-color: #64c8ff;
            box-shadow: 0 0 25px rgba(100, 200, 255, 0.5);
        }

        .control-btn.pressed::after {
            opacity: 1;
        }

        .jump-btn {
            width: 80px;
            height: 80px;
            background: rgba(100, 200, 255, 0.15);
            border-color: rgba(100, 200, 255, 0.4);
        }

        /* Fire button - right side for mobile */
        .fire-btn {
            position: fixed;
            bottom: 30px;
            right: 25px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid rgba(255, 80, 80, 0.4);
            background: rgba(30, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            color: #ff5555;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            box-shadow: 0 4px 25px rgba(255, 0, 0, 0.3);
            z-index: 100;
        }

        .fire-btn.pressed {
            transform: scale(0.9);
            background: rgba(255, 80, 80, 0.3);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
        }

        /* Game Over Screen */
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .game-over.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .game-over-title {
            font-size: 52px;
            font-weight: 900;
            color: #ff4444;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.6),
                         0 0 60px rgba(255, 0, 0, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .game-over-stats {
            color: #ccc;
            font-size: 18px;
            text-align: center;
            line-height: 1.8;
        }

        .game-over-stats span {
            color: #64c8ff;
            font-weight: 700;
        }

        .restart-btn {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #64c8ff;
            background: rgba(100, 200, 255, 0.15);
            color: #64c8ff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
        }

        .restart-btn:hover {
            background: rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.5);
            transform: translateY(-2px);
        }

        /* Score popup */
        .score-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            pointer-events: none;
            z-index: 200;
            opacity: 0;
        }

        .score-popup.show {
            animation: scoreFloat 1s ease forwards;
        }

        @keyframes scoreFloat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
        }

        /* Minimap */
        .minimap {
            position: fixed;
            bottom: 120px;
            right: 15px;
            width: 150px;
            height: 100px;
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 10px;
            z-index: 100;
            overflow: hidden;
        }

        .minimap canvas {
            width: 100%;
            height: 100%;
        }

        /* Start Screen */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .start-title {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(100, 200, 255, 0.5);
        }

        .start-subtitle {
            font-size: 16px;
            color: #64c8ff;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .start-btn {
            padding: 18px 60px;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px solid #64c8ff;
            background: transparent;
            color: #64c8ff;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
        }

        .start-btn:hover {
            background: rgba(100, 200, 255, 0.15);
            box-shadow: 0 0 50px rgba(100, 200, 255, 0.4);
            transform: translateY(-3px);
        }

        .controls-hint {
            color: #666;
            font-size: 13px;
            text-align: center;
            line-height: 1.8;
            margin-top: 10px;
        }

        .controls-hint kbd {
            background: rgba(100, 200, 255, 0.2);
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 4px;
            padding: 2px 8px;
            color: #64c8ff;
            font-family: inherit;
        }

        /* Kill feed */
        .kill-feed {
            position: fixed;
            top: 100px;
            left: 15px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .kill-msg {
            background: rgba(10, 15, 30, 0.8);
            border-left: 3px solid #ff4444;
            padding: 6px 12px;
            border-radius: 0 8px 8px 0;
            color: #fff;
            font-size: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Damage overlay */
        .damage-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0);
            transition: box-shadow 0.2s;
        }

        .damage-overlay.hit {
            box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.6);
        }

        /* Combo indicator */
        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            z-index: 200;
            opacity: 0;
        }

        .combo-display.show {
            animation: comboPop 0.8s ease forwards;
        }

        @keyframes comboPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(2) rotate(-10deg); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            80% { opacity: 1; transform: translate(-50%, -60%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(0.8); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .weapon-btn {
                width: 48px;
                height: 48px;
            }
            .weapon-icon { font-size: 18px; }
            .weapon-name { font-size: 7px; }
            .control-btn { width: 60px; height: 60px; font-size: 24px; }
            .jump-btn { width: 68px; height: 68px; }
            .fire-btn { width: 75px; height: 75px; font-size: 12px; }
            .game-over-title { font-size: 36px; }
            .start-title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Damage Overlay -->
    <div class="damage-overlay" id="damageOverlay"></div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-title">Open World<br>Shooting Game</div>
        <div class="start-subtitle">Tactical Combat Simulator</div>
        <button class="start-btn" id="startBtn">Enter Combat</button>
        <div class="controls-hint">
            <kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd> to Move &nbsp;|&nbsp; 
            <kbd>Space</kbd> <kbd>W</kbd> or <kbd>↑</kbd> to Jump &nbsp;|&nbsp; 
            <kbd>Click</kbd> or <kbd>Tap</kbd> to Shoot<br>
            <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> to Switch Weapons
        </div>
    </div>

    <!-- HUD Top Left -->
    <div class="hud-top-left" id="hudLeft" style="display:none;">
        <div class="hud-panel">
            <div class="hud-label">Level</div>
            <div class="hud-value" id="levelDisplay">1</div>
        </div>
        <div class="hud-panel">
            <div class="hud-label">Health</div>
            <div class="health-bar-container">
                <div class="health-bar" id="healthBar" style="width: 100%;"></div>
            </div>
            <div class="health-text" id="healthText">100 / 100</div>
        </div>
        <div class="hud-panel">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="scoreDisplay">0</div>
        </div>
        <div class="hud-panel">
            <div class="hud-label">Kills</div>
            <div class="hud-value" id="killsDisplay">0</div>
        </div>
    </div>

    <!-- HUD Top Right -->
    <div class="hud-top-right" id="hudRight" style="display:none;">
        <button class="weapon-btn active" data-weapon="pistol" id="btnPistol">
            <span class="weapon-icon">🔫</span>
            <span class="weapon-name">Pistol</span>
        </button>
        <button class="weapon-btn" data-weapon="smg" id="btnSmg">
            <span class="weapon-icon">🔫</span>
            <span class="weapon-name">SMG</span>
        </button>
        <button class="weapon-btn" data-weapon="rifle" id="btnRifle">
            <span class="weapon-icon">🔫</span>
            <span class="weapon-name">Rifle</span>
        </button>
        <button class="weapon-btn" data-weapon="shotgun" id="btnShotgun">
            <span class="weapon-icon">🔫</span>
            <span class="weapon-name">Shotgun</span>
        </button>
    </div>

    <!-- Ammo Display -->
    <div class="ammo-display" id="ammoDisplay" style="display:none;">
        Ammo: <span id="ammoCount">∞</span> / <span id="ammoMax">∞</span>
    </div>

    <!-- Kill Feed -->
    <div class="kill-feed" id="killFeed"></div>

    <!-- Combo Display -->
    <div class="combo-display" id="comboDisplay">COMBO x3!</div>

    <!-- Score Popup -->
    <div class="score-popup" id="scorePopup">+100</div>

    <!-- Minimap -->
    <div class="minimap" id="minimap" style="display:none;">
        <canvas id="minimapCanvas" width="150" height="100"></canvas>
    </div>

    <!-- Movement Controls -->
    <div class="controls-bottom" id="controlsBottom" style="display:none;">
        <button class="control-btn" id="btnLeft">◀</button>
        <button class="control-btn jump-btn" id="btnJump">▲</button>
        <button class="control-btn" id="btnRight">▶</button>
    </div>

    <!-- Fire Button -->
    <button class="fire-btn" id="btnFire" style="display:none;">FIRE</button>

    <!-- Game Over -->
    <div class="game-over" id="gameOver">
        <div class="game-over-title">Game Over</div>
        <div class="game-over-stats">
            Level Reached: <span id="finalLevel">1</span><br>
            Total Kills: <span id="finalKills">0</span><br>
            Final Score: <span id="finalScore">0</span>
        </div>
        <button class="restart-btn" id="restartBtn">Restart Mission</button>
    </div>

    <script>
        // ==================== GAME ENGINE ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        // Game state
        let gameRunning = false;
        let gamePaused = false;
        let lastTime = 0;
        let camera = { x: 0, y: 0 };
        let shake = { x: 0, y: 0, intensity: 0 };

        // World settings
        const WORLD_WIDTH = 8000;
        const WORLD_HEIGHT = 2000;
        const GRAVITY = 0.6;
        const GROUND_Y = 1800;

        // Player
        const player = {
            x: 200,
            y: GROUND_Y - 100,
            width: 40,
            height: 60,
            vx: 0,
            vy: 0,
            speed: 6,
            jumpPower: 14,
            health: 100,
            maxHealth: 100,
            facing: 1, // 1 = right, -1 = left
            onGround: false,
            shooting: false,
            shootTimer: 0,
            invulnerable: 0,
            level: 1,
            score: 0,
            kills: 0,
            combo: 0,
            comboTimer: 0,
            weapon: 'pistol'
        };

        // Weapons config
        const weapons = {
            pistol: {
                name: 'Pistol',
                damage: 25,
                fireRate: 350,
                bulletSpeed: 15,
                spread: 0.02,
                ammo: Infinity,
                maxAmmo: Infinity,
                color: '#ffaa00',
                trail: '#ffdd44',
                sound: 'light'
            },
            smg: {
                name: 'SMG',
                damage: 12,
                fireRate: 80,
                bulletSpeed: 18,
                spread: 0.08,
                ammo: 300,
                maxAmmo: 300,
                color: '#00ff88',
                trail: '#88ffcc',
                sound: 'rapid'
            },
            rifle: {
                name: 'Rifle',
                damage: 45,
                fireRate: 180,
                bulletSpeed: 22,
                spread: 0.01,
                ammo: 120,
                maxAmmo: 120,
                color: '#4488ff',
                trail: '#88bbff',
                sound: 'heavy'
            },
            shotgun: {
                name: 'Shotgun',
                damage: 15,
                fireRate: 600,
                bulletSpeed: 14,
                spread: 0.15,
                pellets: 5,
                ammo: 60,
                maxAmmo: 60,
                color: '#ff4444',
                trail: '#ff8888',
                sound: 'blast'
            }
        };

        // Arrays
        let bullets = [];
        let enemies = [];
        let particles = [];
        let platforms = [];
        let decorations = [];
        let lootCrates = [];
        let enemyBullets = [];

        // Input state
        const keys = {};
        let mouseX = 0, mouseY = 0;
        let mouseDown = false;

        // Touch state
        const touchState = {
            left: false,
            right: false,
            jump: false,
            fire: false
        };

        // ==================== INITIALIZATION ====================
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==================== WORLD GENERATION ====================
        function generateWorld() {
            platforms = [];
            decorations = [];
            lootCrates = [];

            // Ground platforms
            for (let x = 0; x < WORLD_WIDTH; x += 200) {
                platforms.push({
                    x: x,
                    y: GROUND_Y,
                    width: 220,
                    height: 200,
                    type: 'ground'
                });
            }

            // Floating platforms
            const platformCount = 80;
            for (let i = 0; i < platformCount; i++) {
                const x = Math.random() * (WORLD_WIDTH - 300) + 100;
                const y = Math.random() * (GROUND_Y - 400) + 200;
                const width = Math.random() * 200 + 100;
                platforms.push({
                    x: x,
                    y: y,
                    width: width,
                    height: 20,
                    type: 'floating'
                });
            }

            // Decorations (trees, rocks, buildings)
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * WORLD_WIDTH;
                const y = GROUND_Y - Math.random() * 100;
                const type = Math.random() > 0.5 ? 'tree' : 'rock';
                decorations.push({ x, y, type, size: Math.random() * 30 + 20 });
            }

            // Loot crates
            for (let i = 0; i < 30; i++) {
                lootCrates.push({
                    x: Math.random() * (WORLD_WIDTH - 400) + 200,
                    y: Math.random() * (GROUND_Y - 300) + 100,
                    width: 30,
                    height: 30,
                    type: Math.random() > 0.5 ? 'health' : 'ammo',
                    active: true,
                    bobOffset: Math.random() * Math.PI * 2
                });
            }
        }

        // ==================== ENEMY SPAWNING ====================
        function spawnEnemy() {
            const side = Math.random() > 0.5 ? 1 : -1;
            const x = side > 0 ? camera.x + canvas.width + 50 : camera.x - 50;
            const types = ['soldier', 'heavy', 'sniper', 'drone'];
            const type = types[Math.floor(Math.random() * types.length)];

            const enemyConfig = {
                soldier: { health: 60, speed: 2, damage: 10, fireRate: 1000, color: '#ff4444', size: 35, score: 100 },
                heavy: { health: 150, speed: 1, damage: 20, fireRate: 800, color: '#ff8800', size: 45, score: 250 },
                sniper: { health: 40, speed: 1.5, damage: 30, fireRate: 2000, color: '#ff00ff', size: 30, score: 300 },
                drone: { health: 30, speed: 3, damage: 8, fireRate: 600, color: '#00ffff', size: 25, score: 150, flying: true }
            };

            const config = enemyConfig[type];
            const y = config.flying ? Math.random() * (GROUND_Y - 500) + 200 : GROUND_Y - config.size;

            enemies.push({
                x: x,
                y: y,
                width: config.size,
                height: config.size,
                vx: 0,
                vy: 0,
                health: config.health,
                maxHealth: config.health,
                speed: config.speed,
                damage: config.damage,
                fireRate: config.fireRate,
                lastShot: 0,
                color: config.color,
                type: type,
                score: config.score,
                facing: -side,
                state: 'chase',
                stateTimer: 0,
                hitFlash: 0
            });
        }

        // ==================== INPUT HANDLING ====================
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === '1') switchWeapon('pistol');
            if (e.key === '2') switchWeapon('smg');
            if (e.key === '3') switchWeapon('rifle');
            if (e.key === '4') switchWeapon('shotgun');
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('mousedown', () => mouseDown = true);
        canvas.addEventListener('mouseup', () => mouseDown = false);

        // Touch controls
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');
        const btnFire = document.getElementById('btnFire');

        function setupTouchBtn(btn, stateKey) {
            const start = (e) => { e.preventDefault(); touchState[stateKey] = true; btn.classList.add('pressed'); };
            const end = (e) => { e.preventDefault(); touchState[stateKey] = false; btn.classList.remove('pressed'); };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('touchcancel', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        }

        setupTouchBtn(btnLeft, 'left');
        setupTouchBtn(btnRight, 'right');
        setupTouchBtn(btnJump, 'jump');
        setupTouchBtn(btnFire, 'fire');

        // Weapon buttons
        document.querySelectorAll('.weapon-btn').forEach(btn => {
            btn.addEventListener('click', () => switchWeapon(btn.dataset.weapon));
        });

        function switchWeapon(weaponName) {
            if (!weapons[weaponName]) return;
            player.weapon = weaponName;
            document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn' + weaponName.charAt(0).toUpperCase() + weaponName.slice(1)).classList.add('active');
            updateAmmoDisplay();
        }

        function updateAmmoDisplay() {
            const w = weapons[player.weapon];
            document.getElementById('ammoCount').textContent = w.ammo === Infinity ? '∞' : w.ammo;
            document.getElementById('ammoMax').textContent = w.maxAmmo === Infinity ? '∞' : w.maxAmmo;
        }

        // ==================== GAME LOGIC ====================
        function updatePlayer(dt) {
            // Movement
            const moveLeft = keys['a'] || keys['arrowleft'] || touchState.left;
            const moveRight = keys['d'] || keys['arrowright'] || touchState.right;
            const jump = keys['w'] || keys['arrowup'] || keys[' '] || touchState.jump;

            if (moveLeft) {
                player.vx = -player.speed;
                player.facing = -1;
            } else if (moveRight) {
                player.vx = player.speed;
                player.facing = 1;
            } else {
                player.vx *= 0.8;
            }

            // Jump
            if (jump && player.onGround) {
                player.vy = -player.jumpPower;
                player.onGround = false;
                // Jump particles
                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: player.x + player.width / 2,
                        y: player.y + player.height,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -Math.random() * 3,
                        life: 20,
                        maxLife: 20,
                        color: '#aaa',
                        size: Math.random() * 4 + 2
                    });
                }
            }

            // Gravity
            player.vy += GRAVITY;

            // Apply velocity
            player.x += player.vx;
            player.y += player.vy;

            // World bounds
            player.x = Math.max(0, Math.min(WORLD_WIDTH - player.width, player.x));

            // Platform collision
            player.onGround = false;
            for (const plat of platforms) {
                if (player.x + player.width > plat.x && 
                    player.x < plat.x + plat.width &&
                    player.y + player.height > plat.y &&
                    player.y + player.height < plat.y + plat.height + 20 &&
                    player.vy >= 0) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            // Fall off world
            if (player.y > WORLD_HEIGHT) {
                player.health = 0;
            }

            // Shooting
            const w = weapons[player.weapon];
            const shooting = mouseDown || touchState.fire;

            if (shooting && player.shootTimer <= 0 && w.ammo > 0) {
                shoot();
                player.shootTimer = w.fireRate;
                if (w.ammo !== Infinity) {
                    w.ammo--;
                    updateAmmoDisplay();
                }
            }

            if (player.shootTimer > 0) player.shootTimer -= dt;

            // Invulnerability
            if (player.invulnerable > 0) player.invulnerable -= dt;

            // Combo timer
            if (player.comboTimer > 0) {
                player.comboTimer -= dt;
                if (player.comboTimer <= 0) player.combo = 0;
            }

            // Camera follow
            const targetCamX = player.x - canvas.width / 2 + player.width / 2;
            const targetCamY = player.y - canvas.height / 2 + player.height / 2;
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;
            camera.x = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, camera.x));
            camera.y = Math.max(-200, Math.min(WORLD_HEIGHT - canvas.height, camera.y));

            // Screen shake decay
            if (shake.intensity > 0) {
                shake.x = (Math.random() - 0.5) * shake.intensity;
                shake.y = (Math.random() - 0.5) * shake.intensity;
                shake.intensity *= 0.9;
                if (shake.intensity < 0.5) shake.intensity = 0;
            }
        }

        function shoot() {
            const w = weapons[player.weapon];
            const startX = player.x + player.width / 2;
            const startY = player.y + player.height / 2;

            // Calculate aim direction (mouse or facing)
            let dirX = player.facing;
            let dirY = 0;

            if (!touchState.fire) {
                const worldMouseX = mouseX + camera.x;
                const worldMouseY = mouseY + camera.y;
                const dx = worldMouseX - startX;
                const dy = worldMouseY - startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    dirX = dx / dist;
                    dirY = dy / dist;
                }
            }

            const pellets = w.pellets || 1;
            for (let i = 0; i < pellets; i++) {
                const spreadAngle = (Math.random() - 0.5) * w.spread * 2;
                const cos = Math.cos(spreadAngle);
                const sin = Math.sin(spreadAngle);
                const finalDirX = dirX * cos - dirY * sin;
                const finalDirY = dirX * sin + dirY * cos;

                bullets.push({
                    x: startX,
                    y: startY,
                    vx: finalDirX * w.bulletSpeed,
                    vy: finalDirY * w.bulletSpeed,
                    damage: w.damage,
                    color: w.color,
                    trail: w.trail,
                    life: 120,
                    owner: 'player'
                });
            }

            // Muzzle flash
            shake.intensity = Math.max(shake.intensity, w.damage / 5);
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: startX + dirX * 20,
                    y: startY + dirY * 20,
                    vx: dirX * 3 + (Math.random() - 0.5) * 4,
                    vy: dirY * 3 + (Math.random() - 0.5) * 4,
                    life: 10,
                    maxLife: 10,
                    color: w.color,
                    size: Math.random() * 6 + 3
                });
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                // Trail particles
                if (b.life % 2 === 0) {
                    particles.push({
                        x: b.x,
                        y: b.y,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        life: 8,
                        maxLife: 8,
                        color: b.trail,
                        size: 2
                    });
                }

                // Remove if out of bounds or expired
                if (b.life <= 0 || b.x < 0 || b.x > WORLD_WIDTH || b.y < 0 || b.y > WORLD_HEIGHT) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Collision with enemies (player bullets)
                if (b.owner === 'player') {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (b.x > e.x && b.x < e.x + e.width &&
                            b.y > e.y && b.y < e.y + e.height) {
                            e.health -= b.damage;
                            e.hitFlash = 5;
                            bullets.splice(i, 1);

                            // Hit particles
                            for (let k = 0; k < 6; k++) {
                                particles.push({
                                    x: b.x,
                                    y: b.y,
                                    vx: (Math.random() - 0.5) * 6,
                                    vy: (Math.random() - 0.5) * 6,
                                    life: 15,
                                    maxLife: 15,
                                    color: e.color,
                                    size: Math.random() * 4 + 2
                                });
                            }

                            if (e.health <= 0) {
                                killEnemy(e, j);
                            }
                            break;
                        }
                    }
                }
            }

            // Enemy bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                if (b.life <= 0) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Hit player
                if (b.x > player.x && b.x < player.x + player.width &&
                    b.y > player.y && b.y < player.y + player.height) {
                    if (player.invulnerable <= 0) {
                        player.health -= b.damage;
                        player.invulnerable = 500;
                        shake.intensity = 15;
                        document.getElementById('damageOverlay').classList.add('hit');
                        setTimeout(() => document.getElementById('damageOverlay').classList.remove('hit'), 200);

                        for (let k = 0; k < 8; k++) {
                            particles.push({
                                x: b.x,
                                y: b.y,
                                vx: (Math.random() - 0.5) * 5,
                                vy: (Math.random() - 0.5) * 5,
                                life: 20,
                                maxLife: 20,
                                color: '#ff0000',
                                size: Math.random() * 5 + 3
                            });
                        }
                    }
                    enemyBullets.splice(i, 1);
                }
            }
        }

        function killEnemy(enemy, index) {
            // Score with combo
            player.combo++;
            player.comboTimer = 3000;
            const comboMultiplier = Math.min(player.combo, 5);
            const points = enemy.score * comboMultiplier;
            player.score += points;
            player.kills++;

            // Show score popup
            if (comboMultiplier > 1) {
                showCombo(player.combo);
            }
            showScorePopup(points);

            // Kill feed
            addKillFeed(enemy.type);

            // Death explosion
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: enemy.x + enemy.width / 2,
                    y: enemy.y + enemy.height / 2,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 40,
                    maxLife: 40,
                    color: enemy.color,
                    size: Math.random() * 6 + 3
                });
            }

            enemies.splice(index, 1);

            // Level up check
            if (player.kills % 10 === 0) {
                player.level++;
                player.maxHealth += 20;
                player.health = player.maxHealth;
                showScorePopup('LEVEL UP!');
            }
        }

        function updateEnemies(dt) {
            // Spawn enemies based on level
            const maxEnemies = 5 + player.level * 3;
            const spawnRate = Math.max(2000 - player.level * 200, 500);

            if (enemies.length < maxEnemies && Math.random() < dt / spawnRate) {
                spawnEnemy();
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // AI Behavior
                if (dist < 600) {
                    // Chase player
                    if (Math.abs(dx) > 50) {
                        e.vx = (dx > 0 ? 1 : -1) * e.speed;
                        e.facing = dx > 0 ? 1 : -1;
                    } else {
                        e.vx = 0;
                    }

                    // Shooting
                    if (Date.now() - e.lastShot > e.fireRate && dist < 500) {
                        e.lastShot = Date.now();
                        const dirX = dx / dist;
                        const dirY = dy / dist;
                        enemyBullets.push({
                            x: e.x + e.width / 2,
                            y: e.y + e.height / 2,
                            vx: dirX * 8,
                            vy: dirY * 8,
                            damage: e.damage,
                            color: '#ff4444',
                            life: 100
                        });
                    }
                } else {
                    // Patrol
                    e.vx = e.facing * e.speed * 0.5;
                }

                e.x += e.vx;

                // Platform collision for enemies
                if (!e.flying) {
                    e.onGround = false;
                    for (const plat of platforms) {
                        if (e.x + e.width > plat.x && 
                            e.x < plat.x + plat.width &&
                            e.y + e.height > plat.y &&
                            e.y + e.height < plat.y + plat.height + 20) {
                            e.y = plat.y - e.height;
                            e.onGround = true;
                        }
                    }
                    if (!e.onGround) e.y += GRAVITY;
                } else {
                    // Flying enemies hover
                    e.y += Math.sin(Date.now() / 500 + e.x) * 0.5;
                }

                // Hit flash
                if (e.hitFlash > 0) e.hitFlash--;
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // gravity
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function updateLootCrates() {
            for (const crate of lootCrates) {
                if (!crate.active) continue;

                // Bob animation
                crate.bobOffset += 0.05;

                // Collision with player
                if (player.x < crate.x + crate.width &&
                    player.x + player.width > crate.x &&
                    player.y < crate.y + crate.height + Math.sin(crate.bobOffset) * 5 &&
                    player.y + player.height > crate.y + Math.sin(crate.bobOffset) * 5) {

                    crate.active = false;

                    if (crate.type === 'health') {
                        player.health = Math.min(player.health + 30, player.maxHealth);
                        showScorePopup('+30 HP');
                    } else {
                        // Ammo for all weapons
                        weapons.smg.ammo = Math.min(weapons.smg.ammo + 60, weapons.smg.maxAmmo);
                        weapons.rifle.ammo = Math.min(weapons.rifle.ammo + 30, weapons.rifle.maxAmmo);
                        weapons.shotgun.ammo = Math.min(weapons.shotgun.ammo + 15, weapons.shotgun.maxAmmo);
                        updateAmmoDisplay();
                        showScorePopup('+Ammo');
                    }

                    // Pickup particles
                    for (let i = 0; i < 10; i++) {
                        particles.push({
                            x: crate.x + crate.width / 2,
                            y: crate.y + crate.height / 2,
                            vx: (Math.random() - 0.5) * 5,
                            vy: -Math.random() * 5,
                            life: 25,
                            maxLife: 25,
                            color: crate.type === 'health' ? '#44ff44' : '#ffff44',
                            size: Math.random() * 5 + 3
                        });
                    }
                }
            }
        }

        // ==================== UI UPDATES ====================
        function updateHUD() {
            document.getElementById('levelDisplay').textContent = player.level;
            document.getElementById('scoreDisplay').textContent = player.score.toLocaleString();
            document.getElementById('killsDisplay').textContent = player.kills;

            const healthPercent = (player.health / player.maxHealth) * 100;
            document.getElementById('healthBar').style.width = healthPercent + '%';
            document.getElementById('healthText').textContent = Math.max(0, Math.ceil(player.health)) + ' / ' + player.maxHealth;

            // Health bar color
            const bar = document.getElementById('healthBar');
            if (healthPercent > 60) {
                bar.style.background = 'linear-gradient(90deg, #44ff44, #88ff88)';
            } else if (healthPercent > 30) {
                bar.style.background = 'linear-gradient(90deg, #ffaa00, #ffdd44)';
            } else {
                bar.style.background = 'linear-gradient(90deg, #ff0000, #ff4444)';
            }
        }

        function showScorePopup(text) {
            const popup = document.getElementById('scorePopup');
            popup.textContent = text;
            popup.classList.remove('show');
            void popup.offsetWidth; // trigger reflow
            popup.classList.add('show');
        }

        function showCombo(combo) {
            const display = document.getElementById('comboDisplay');
            display.textContent = 'COMBO x' + combo + '!';
            display.classList.remove('show');
            void display.offsetWidth;
            display.classList.add('show');
        }

        function addKillFeed(enemyType) {
            const feed = document.getElementById('killFeed');
            const msg = document.createElement('div');
            msg.className = 'kill-msg';
            msg.textContent = '☠ Eliminated ' + enemyType.charAt(0).toUpperCase() + enemyType.slice(1);
            feed.appendChild(msg);

            setTimeout(() => {
                msg.style.opacity = '0';
                msg.style.transform = 'translateX(-100%)';
                setTimeout(() => msg.remove(), 300);
            }, 3000);

            if (feed.children.length > 5) {
                feed.removeChild(feed.firstChild);
            }
        }

        // ==================== RENDERING ====================
        function draw() {
            // Clear with dark background
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-camera.x + shake.x, -camera.y + shake.y);

            // Draw background grid
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = Math.floor(camera.x / 100) * 100; x < camera.x + canvas.width + 100; x += 100) {
                ctx.beginPath();
                ctx.moveTo(x, camera.y);
                ctx.lineTo(x, camera.y + canvas.height);
                ctx.stroke();
            }
            for (let y = Math.floor(camera.y / 100) * 100; y < camera.y + canvas.height + 100; y += 100) {
                ctx.beginPath();
                ctx.moveTo(camera.x, y);
                ctx.lineTo(camera.x + canvas.width, y);
                ctx.stroke();
            }

            // Draw distant mountains/parallax
            ctx.fillStyle = 'rgba(20, 25, 40, 0.5)';
            for (let x = 0; x < WORLD_WIDTH; x += 300) {
                const height = Math.sin(x * 0.001) * 100 + 150;
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x + 150, GROUND_Y - height);
                ctx.lineTo(x + 300, GROUND_Y);
                ctx.fill();
            }

            // Draw platforms
            for (const plat of platforms) {
                if (plat.x + plat.width < camera.x - 100 || plat.x > camera.x + canvas.width + 100) continue;

                if (plat.type === 'ground') {
                    // Ground with texture
                    ctx.fillStyle = '#1a1a2e';
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.fillStyle = '#2a2a4e';
                    ctx.fillRect(plat.x, plat.y, plat.width, 4);

                    // Grid pattern on ground
                    ctx.strokeStyle = 'rgba(100, 200, 255, 0.05)';
                    ctx.lineWidth = 1;
                    for (let gx = plat.x; gx < plat.x + plat.width; gx += 40) {
                        ctx.beginPath();
                        ctx.moveTo(gx, plat.y);
                        ctx.lineTo(gx, plat.y + plat.height);
                        ctx.stroke();
                    }
                } else {
                    // Floating platform
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.15)';
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.fillStyle = 'rgba(100, 200, 255, 0.4)';
                    ctx.fillRect(plat.x, plat.y, plat.width, 3);

                    // Glow
                    ctx.shadowColor = 'rgba(100, 200, 255, 0.3)';
                    ctx.shadowBlur = 10;
                    ctx.strokeStyle = 'rgba(100, 200, 255, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
                    ctx.shadowBlur = 0;
                }
            }

            // Draw decorations
            for (const dec of decorations) {
                if (dec.x < camera.x - 100 || dec.x > camera.x + canvas.width + 100) continue;

                if (dec.type === 'tree') {
                    ctx.fillStyle = 'rgba(40, 60, 40, 0.6)';
                    ctx.beginPath();
                    ctx.moveTo(dec.x, dec.y);
                    ctx.lineTo(dec.x - dec.size / 2, dec.y + dec.size);
                    ctx.lineTo(dec.x + dec.size / 2, dec.y + dec.size);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(60, 60, 70, 0.5)';
                    ctx.beginPath();
                    ctx.arc(dec.x, dec.y + dec.size / 2, dec.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw loot crates
            for (const crate of lootCrates) {
                if (!crate.active) continue;
                if (crate.x < camera.x - 100 || crate.x > camera.x + canvas.width + 100) continue;

                const bobY = Math.sin(crate.bobOffset) * 5;
                const cx = crate.x + crate.width / 2;
                const cy = crate.y + crate.height / 2 + bobY;

                // Glow
                ctx.shadowColor = crate.type === 'health' ? '#44ff44' : '#ffff44';
                ctx.shadowBlur = 15;

                ctx.fillStyle = crate.type === 'health' ? 'rgba(68, 255, 68, 0.8)' : 'rgba(255, 255, 68, 0.8)';
                ctx.fillRect(crate.x, crate.y + bobY, crate.width, crate.height);

                ctx.shadowBlur = 0;

                // Icon
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(crate.type === 'health' ? '+' : '♦', cx, cy + 5);
            }

            // Draw enemies
            for (const e of enemies) {
                if (e.x < camera.x - 100 || e.x > camera.x + canvas.width + 100) continue;

                // Hit flash
                if (e.hitFlash > 0) {
                    ctx.fillStyle = '#fff';
                } else {
                    ctx.fillStyle = e.color;
                }

                // Body
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.shadowBlur = 0;

                // Health bar
                const hpPercent = e.health / e.maxHealth;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(e.x, e.y - 8, e.width, 4);
                ctx.fillStyle = hpPercent > 0.5 ? '#44ff44' : '#ff4444';
                ctx.fillRect(e.x, e.y - 8, e.width * hpPercent, 4);

                // Eyes
                ctx.fillStyle = '#fff';
                const eyeX = e.facing > 0 ? e.x + e.width - 8 : e.x + 4;
                ctx.fillRect(eyeX, e.y + 8, 4, 4);
            }

            // Draw player
            if (player.invulnerable <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.fillStyle = '#64c8ff';
                ctx.shadowColor = '#64c8ff';
                ctx.shadowBlur = 15;
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.shadowBlur = 0;

                // Eyes
                ctx.fillStyle = '#fff';
                const pEyeX = player.facing > 0 ? player.x + player.width - 10 : player.x + 4;
                ctx.fillRect(pEyeX, player.y + 12, 6, 6);

                // Weapon indicator
                const w = weapons[player.weapon];
                ctx.fillStyle = w.color;
                ctx.fillRect(
                    player.facing > 0 ? player.x + player.width : player.x - 12,
                    player.y + 20,
                    12,
                    6
                );
            }

            // Draw bullets
            for (const b of bullets) {
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw enemy bullets
            for (const b of enemyBullets) {
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw particles
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            ctx.restore();

            // Draw minimap
            drawMinimap();
        }

        function drawMinimap() {
            minimapCtx.fillStyle = 'rgba(10, 15, 30, 0.9)';
            minimapCtx.fillRect(0, 0, 150, 100);

            const scaleX = 150 / WORLD_WIDTH;
            const scaleY = 100 / WORLD_HEIGHT;

            // Player
            minimapCtx.fillStyle = '#64c8ff';
            minimapCtx.fillRect(player.x * scaleX - 2, player.y * scaleY - 2, 4, 4);

            // Enemies
            minimapCtx.fillStyle = '#ff4444';
            for (const e of enemies) {
                minimapCtx.fillRect(e.x * scaleX - 1, e.y * scaleY - 1, 2, 2);
            }

            // Camera view
            minimapCtx.strokeStyle = 'rgba(100, 200, 255, 0.3)';
            minimapCtx.lineWidth = 1;
            minimapCtx.strokeRect(
                camera.x * scaleX,
                camera.y * scaleY,
                canvas.width * scaleX,
                canvas.height * scaleY
            );
        }

        // ==================== GAME LOOP ====================
        function gameLoop(timestamp) {
            if (!gameRunning) return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            if (!gamePaused) {
                updatePlayer(dt);
                updateBullets();
                updateEnemies(dt);
                updateParticles();
                updateLootCrates();
                updateHUD();

                // Check game over
                if (player.health <= 0) {
                    gameOver();
                    return;
                }
            }

            draw();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalLevel').textContent = player.level;
            document.getElementById('finalKills').textContent = player.kills;
            document.getElementById('finalScore').textContent = player.score.toLocaleString();
            document.getElementById('gameOver').classList.add('show');
            document.getElementById('hudLeft').style.display = 'none';
            document.getElementById('hudRight').style.display = 'none';
            document.getElementById('ammoDisplay').style.display = 'none';
            document.getElementById('controlsBottom').style.display = 'none';
            document.getElementById('btnFire').style.display = 'none';
            document.getElementById('minimap').style.display = 'none';
        }

        function startGame() {
            // Reset player
            player.x = 200;
            player.y = GROUND_Y - 100;
            player.vx = 0;
            player.vy = 0;
            player.health = 100;
            player.maxHealth = 100;
            player.level = 1;
            player.score = 0;
            player.kills = 0;
            player.combo = 0;
            player.weapon = 'pistol';
            player.invulnerable = 0;

            // Reset weapons ammo
            weapons.smg.ammo = weapons.smg.maxAmmo;
            weapons.rifle.ammo = weapons.rifle.maxAmmo;
            weapons.shotgun.ammo = weapons.shotgun.maxAmmo;

            // Clear arrays
            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];

            // Generate world
            generateWorld();

            // Spawn initial enemies
            for (let i = 0; i < 3; i++) spawnEnemy();

            // UI
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOver').classList.remove('show');
            document.getElementById('hudLeft').style.display = 'flex';
            document.getElementById('hudRight').style.display = 'flex';
            document.getElementById('ammoDisplay').style.display = 'block';
            document.getElementById('controlsBottom').style.display = 'flex';
            document.getElementById('btnFire').style.display = 'flex';
            document.getElementById('minimap').style.display = 'block';
            document.getElementById('killFeed').innerHTML = '';

            // Reset weapon buttons
            document.querySelectorAll('.weapon-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btnPistol').classList.add('active');
            updateAmmoDisplay();

            gameRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Prevent context menu on canvas
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Initial draw
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
</body>
</html>
